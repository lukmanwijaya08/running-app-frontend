<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/playon-favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>PlayonApp - Lacak & Kuasai Jalanan</title>

    <!-- KONFIGURASI PWA KHUSUS APPLE / IOS -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="PlayonApp" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#0F172A" />

    <!-- Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      body,
      html {
        background-color: #0f172a;
        margin: 0;
        padding: 0;
      }

      /* CSS Splash Screen dipindah ke Head agar rapi */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #0f172a; /* Menyesuaikan tema gelap Anda */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: opacity 1s ease-out; /* Transisi memudar super halus 1 detik */
      }

      .splash-title {
        color: #ccff00;
        font-family: "Inter", sans-serif;
        font-size: 35px;
        font-weight: 900;
        letter-spacing: -2px;
        margin: 0;
        animation: smoothPulse 3s ease-in-out infinite;
      }

      .splash-subtitle {
        color: #ffffff;
        font-family: "Inter", sans-serif;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 4px;
        margin-top: 16px;
        opacity: 0;
        animation: softFade 1.5s ease-out forwards 0.5s;
      }

      @keyframes smoothPulse {
        0% {
          opacity: 0.8;
          transform: scale(0.98);
          text-shadow: 0 0 0 rgba(204, 255, 0, 0);
        }
        50% {
          opacity: 1;
          transform: scale(1.02);
          text-shadow: 0 0 30px rgba(204, 255, 0, 0.4);
        }
        100% {
          opacity: 0.8;
          transform: scale(0.98);
          text-shadow: 0 0 0 rgba(204, 255, 0, 0);
        }
      }

      @keyframes softFade {
        0% {
          opacity: 0;
          transform: translateY(15px);
        }
        100% {
          opacity: 0.6;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <!-- SPLASH SCREEN DITARUH DI LUAR ROOT -->
    <div id="splash-screen">
      <h1 class="splash-title">PLAYONAN.APP</h1>
      <p class="splash-subtitle">MENYIAPKAN RUTE...</p>
    </div>

    <!-- WADAH UTAMA REACT -->
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
